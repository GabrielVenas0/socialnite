
name: SocialNite Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildar e enviar imagem para o Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/socialnite:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Validar configuracao de producao
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/nite

          docker compose -f docker-compose.prod.yml config --quiet

          docker compose -f docker-compose.prod.yml config --format json | python3 -c '
          import json
          import sys

          web = json.load(sys.stdin)["services"]["web"]

          expected = {
              "command": [
                  "node",
                  "/misskey/packages/backend/built/boot/entry.js"
              ],
              "mem_limit": 1610612736,
              "memswap_limit": 1610612736,
              "pids_limit": 128,
              "restart": "unless-stopped"
          }

          for key, value in expected.items():
              actual = web.get(key)
              if actual != value:
                  raise SystemExit(
                      f"ERRO: {key} = {actual!r}; esperado = {value!r}"
                  )

          print("Configuracao de producao validada.")
          '

      - name: Login no Docker Hub e subir containers
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

          cd /opt/nite

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
