name: SocialNite Prod

on:
  push:
    branches:
      - prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildar e enviar imagem para o Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rede-social-nite:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-datacenter:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dos manifestos K8s
        uses: actions/checkout@v4

      - name: Executar comandos na VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            # Entra na pasta do projeto ou cria se não existir
            mkdir -p ~/rede-social-nite
            cd ~/rede-social-nite

            # Remove arquivos antigos do K8s para evitar conflitos
            rm -rf k8s

      - name: Copiar os novos manifestos K8s para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "k8s/*"
          target: "~/rede-social-nite"

      - name: Aplicar as alterações no Kubernetes da VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            cd ~/rede-social-nite
            # Aplica todos os manifestos na pasta k8s
            sudo kubectl apply -f k8s/
            # Força o deployment do web a reiniciar para puxar a nova imagem gerada
            sudo kubectl rollout restart deployment/web
