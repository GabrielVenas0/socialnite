
name: Dockle

on:
  pull_request:
  push:
    branches:
      - prod

permissions:
  contents: read

jobs:
  dockle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem para auditoria
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: socialnite-ci:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Instalar Dockle
        env:
          DOCKLE_VERSION: 0.4.14
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.deb" \
            -o dockle.deb
          sudo dpkg -i dockle.deb

      - name: Auditar imagem Docker
        run: |
          dockle --exit-code 1 socialnite-ci:pr
