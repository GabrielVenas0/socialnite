apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: docker-cred

      volumes:
        - name: web-claim0
          persistentVolumeClaim:
            claimName: web-claim0
        - name: shared-config
          emptyDir: {}
        - name: template-volume
          configMap:
            name: default-template

      initContainers:
        - name: config-builder
          image: alpine:latest
          command: ['sh', '-c', 'apk add --no-cache gettext && envsubst < /tmp/template/default.yml.template > /shared/default.yml']
          envFrom:
            - secretRef:
                name: nite-secrets
          volumeMounts:
            - name: template-volume
              mountPath: /tmp/template
            - name: shared-config
              mountPath: /shared

      containers:
        - name: web
          image: carlosramirez0/rede-social-nite:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: web-claim0
              mountPath: /misskey/files
            - name: shared-config
              mountPath: /misskey/.config/default.yml
              subPath: default.yml

      restartPolicy: Always
