apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data-claim
  labels:
    io.kompose.service: db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: db
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: db
    spec:
      containers:
        - name: db
          image: postgres:15-alpine

          # PUXANDO AS VARIÁVEIS DIRETAMENTE DO SECRET
          envFrom:
            - secretRef:
                name: nite-secrets

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            failureThreshold: 20
            periodSeconds: 5
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-data-volume
      restartPolicy: Always
      volumes:
        - name: db-data-volume
          persistentVolumeClaim:
            claimName: db-data-claim
