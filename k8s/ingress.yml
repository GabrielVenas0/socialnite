apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: socialnite-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: default-limit-100m@kubernetescrd
spec:
  tls:
  - hosts:
    - socialnite.nite.tec.br
    secretName: socialnite-tls-cert
  rules:
  - host: socialnite.nite.tec.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 3000
