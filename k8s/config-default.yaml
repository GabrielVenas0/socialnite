apiVersion: v1
kind: ConfigMap
metadata:
  name: default-template
  namespace: default
data:
  default.yml.template: |
    url: https://socialnite.nite.tec.br
    port: 3000

    db:
      host: db
      port: 5432
      db: ${POSTGRES_DB}
      user: ${POSTGRES_USER}
      pass: ${POSTGRES_PASSWORD}

    redis:
      host: redis
      port: 6379

    id: 'aid'
